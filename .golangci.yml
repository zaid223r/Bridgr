version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-return
        - name: error-naming
        - name: receiver-naming
        - name: indent-error-flow
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [unparam, noctx]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/zaid223r/Bridgr
