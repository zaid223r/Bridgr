name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bridgr
          POSTGRES_PASSWORD: bridgr
          POSTGRES_DB: bridgr
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U bridgr"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: bridgr
          MYSQL_DATABASE: bridgr
          MYSQL_USER: bridgr
          MYSQL_PASSWORD: bridgr
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ubridgr -pbridgr"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
    env:
      BRIDGR_POSTGRES_DSN: postgres://bridgr:bridgr@localhost:55432/bridgr?sslmode=disable
      BRIDGR_MYSQL_DSN: bridgr:bridgr@tcp(localhost:53306)/bridgr?parseTime=true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - run: go test -race -count=1 -tags=integration ./...

  typescript-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/typescript-client/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Regenerate the spec and TypeScript types from the Go API and fail if the
      # committed ones are stale, then type-check and build the app against them.
      - run: bun run gen
      - run: git diff --exit-code -- openapi.json src/api/schema.d.ts
      - run: bun run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
